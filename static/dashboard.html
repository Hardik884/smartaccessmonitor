<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Access Monitor</title>
<link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-name">Access Monitor</span>
    <span class="brand-sub">Doorway sensor, BLE keys</span>
  </div>
  <div class="link" id="link" data-state="pending">
    <span class="link-dot" aria-hidden="true"></span>
    <span class="link-text" id="linkText">Connecting</span>
  </div>
</header>

<div class="notice" id="notice" hidden></div>

<main class="page">
  <section class="summary" aria-label="Today">
    <div class="tile tile-hero">
      <div class="tile-label">Inside now</div>
      <div class="tile-value" id="occTotal">0</div>
      <div class="tile-meta" id="occMeta">&nbsp;</div>
    </div>
    <div class="tile">
      <div class="tile-label">Entries today</div>
      <div class="tile-value" id="entries">0</div>
      <div class="tile-meta" id="exits">&nbsp;</div>
    </div>
    <div class="tile">
      <div class="tile-label">Alerts today</div>
      <div class="tile-value" id="alerts">0</div>
      <div class="tile-meta" id="alertsMeta">&nbsp;</div>
    </div>
    <div class="tile">
      <div class="tile-label">Last event</div>
      <div class="tile-value tile-value-sm" id="lastWhen">None yet</div>
      <div class="tile-meta" id="lastWhat">&nbsp;</div>
    </div>
  </section>

  <div class="columns">
    <section class="panel log" aria-labelledby="logTitle">
      <div class="panel-head">
        <h2 id="logTitle">Event log</h2>
        <div class="segmented" role="tablist" aria-label="Filter events">
          <button role="tab" aria-selected="true" data-filter="all">All</button>
          <button role="tab" aria-selected="false" data-filter="alerts">Alerts</button>
        </div>
      </div>
      <div class="table-wrap">
        <table class="events">
          <thead>
            <tr>
              <th class="c-time">Time</th>
              <th>Person</th>
              <th>Door</th>
              <th>Key</th>
              <th class="c-risk">Risk</th>
              <th>Notes</th>
            </tr>
          </thead>
          <tbody id="eventRows"></tbody>
        </table>
        <div class="empty" id="emptyLog">No events recorded yet.</div>
      </div>
    </section>

    <aside class="side">
      <section class="panel" aria-labelledby="insideTitle">
        <div class="panel-head"><h2 id="insideTitle">Inside now</h2></div>
        <ul class="list" id="insideList"></ul>
      </section>

      <section class="panel" aria-labelledby="keysTitle">
        <div class="panel-head">
          <h2 id="keysTitle">Keys in range</h2>
          <span class="panel-note" id="keysNote"></span>
        </div>
        <ul class="list" id="keysList"></ul>
      </section>

      <section class="panel" aria-labelledby="chartTitle">
        <div class="panel-head">
          <h2 id="chartTitle">Entries by hour, today</h2>
        </div>
        <div class="chart" id="chart"></div>
      </section>

      <section class="panel" aria-labelledby="modelsTitle">
        <div class="panel-head"><h2 id="modelsTitle">Scoring</h2></div>
        <p class="models" id="models">&nbsp;</p>
      </section>
    </aside>
  </div>
</main>

<div class="tooltip" id="tooltip" role="tooltip" hidden></div>

<script src="/static/dashboard.js"></script>
</body>
</html>
